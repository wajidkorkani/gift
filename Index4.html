<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For You ❤️</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:#07030a;color:#fff}body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;overflow:hidden;background:radial-gradient(circle at 20% 20%,#4b1635 0,transparent 30%),radial-gradient(circle at 80% 30%,#24154f 0,transparent 35%),#07030a}.card{position:relative;width:min(760px,100%);padding:44px 28px 34px;text-align:center;border:1px solid #ffffff2b;border-radius:30px;background:#ffffff0d;backdrop-filter:blur(18px);box-shadow:0 30px 90px #000b,0 0 60px #ff39751c;animation:in 1s ease}.card:before{content:"";position:absolute;inset:-2px;border-radius:32px;background:linear-gradient(120deg,transparent,#ff9bc755,transparent,#a477ff55,transparent);z-index:-1;animation:shine 5s linear infinite}.k{font:600 12px Arial;letter-spacing:5px;text-transform:uppercase;color:#ffc7df}h1{font-size:clamp(42px,9vw,76px);margin:14px 0;text-shadow:0 0 35px #ff499055;font-weight:500}.sub{font:15px/1.7 Arial;color:#ffffffb8}.msg{font-size:clamp(19px,4vw,27px);line-height:1.55;color:#fff1f7}.msg b{color:#ff9bc6}.heart{font-size:82px;filter:drop-shadow(0 0 24px #ff3f88);animation:beat 1.7s infinite;margin:8px}.btn{border:0;border-radius:999px;padding:15px 24px;background:linear-gradient(100deg,#ff4f91,#a94cff);color:#fff;font-weight:700;font-size:15px;box-shadow:0 12px 35px #cc378955;cursor:pointer}.hint{margin-top:14px;font:12px Arial;color:#ffffff66}.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:#ffd5e8;box-shadow:0 0 15px #ff72ad;animation:fall linear infinite}@keyframes in{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.07)}}@keyframes shine{to{transform:rotate(360deg)}}@keyframes fall{from{transform:translateY(-10vh);opacity:0}15%{opacity:.9}to{transform:translateY(110vh) translateX(40px);opacity:0}}button:hover{transform:translateY(-3px)}@media(max-width:480px){.card{padding:34px 20px 28px}.msg{font-size:19px}}</style></head><body><main class="card"><div class="k">A little surprise for you🤭p
